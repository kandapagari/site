  </style>
  <rect class="bg" width="32" height="32" fill="#0a0d0a"/>
  <rect class="frame" x="2.5" y="4.5" width="27" height="23" rx="3.5" fill="none" stroke="#6ee7a0" stroke-width="2"/>
  <polyline class="prompt" points="9,12 13.5,16 9,20" fill="none" stroke="#f5a623" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="16.5" y="11" width="6.5" height="10" fill="#6ee7a0"/>
