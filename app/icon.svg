<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="geometricPrecision">
  <style>
    .bg { fill: #0a0d0a; }
    .frame { stroke: #6ee7a0; }
    .prompt { stroke: #f5a623; }
    .cursor { fill: #6ee7a0; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f4f1e8; }
      .frame { stroke: #15170f; }
      .prompt { stroke: #92400e; }
      .cursor { fill: #15170f; }
    }
  </style>
  <rect class="bg" width="32" height="32"/>
  <rect class="frame" x="2.5" y="4.5" width="27" height="23" rx="3.5" fill="none" stroke-width="2"/>
  <polyline class="prompt" points="9,12 13.5,16 9,20" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="16.5" y="11" width="6.5" height="10"/>
</svg>
